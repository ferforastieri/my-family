name: Android APK
on:
  push:
    branches: [main]
    paths:
      - "frontend/app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Write google-services.json
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > frontend/app/android/app/google-services.json
        env:
          GOOGLE_SERVICES_JSON: "${{ secrets.GOOGLE_SERVICES_JSON }}"
      - name: Decode release keystore
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > frontend/app/android/app/release.jks
        env:
          ANDROID_KEYSTORE_BASE64: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}"
      - name: Build release APK
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace/frontend/app \
            -e FIREBASE_API_KEY -e FIREBASE_APP_ID -e FIREBASE_ANDROID_API_KEY \
            -e FIREBASE_ANDROID_APP_ID -e FIREBASE_MESSAGING_SENDER_ID \
            -e FIREBASE_PROJECT_ID -e FIREBASE_AUTH_DOMAIN -e FIREBASE_STORAGE_BUCKET \
            -e FIREBASE_WEB_PUSH_CERTIFICATE_KEY \
            -e ANDROID_KEYSTORE_PATH=/workspace/frontend/app/android/app/release.jks \
            -e ANDROID_KEYSTORE_PASSWORD -e ANDROID_KEY_ALIAS -e ANDROID_KEY_PASSWORD \
            ghcr.io/cirruslabs/flutter:stable sh -lc 'yes | sdkmanager --licenses >/dev/null 2>&1 || true; sdkmanager --install "ndk;28.2.13676358" >/dev/null; flutter pub get && flutter build apk --release --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }} --dart-define=SOCKET_URL=${{ vars.SOCKET_URL }} --dart-define=LANDING_URL=${{ vars.PUBLIC_SITE_URL }} --dart-define=FIREBASE_API_KEY=$FIREBASE_API_KEY --dart-define=FIREBASE_APP_ID=$FIREBASE_APP_ID --dart-define=FIREBASE_ANDROID_API_KEY=$FIREBASE_ANDROID_API_KEY --dart-define=FIREBASE_ANDROID_APP_ID=$FIREBASE_ANDROID_APP_ID --dart-define=FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID --dart-define=FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID --dart-define=FIREBASE_AUTH_DOMAIN=$FIREBASE_AUTH_DOMAIN --dart-define=FIREBASE_STORAGE_BUCKET=$FIREBASE_STORAGE_BUCKET --dart-define=FIREBASE_WEB_PUSH_CERTIFICATE_KEY=$FIREBASE_WEB_PUSH_CERTIFICATE_KEY'
        env:
          FIREBASE_API_KEY: "${{ vars.FIREBASE_API_KEY }}"
          FIREBASE_APP_ID: "${{ vars.FIREBASE_APP_ID }}"
          FIREBASE_ANDROID_API_KEY: "${{ vars.FIREBASE_ANDROID_API_KEY }}"
          FIREBASE_ANDROID_APP_ID: "${{ vars.FIREBASE_ANDROID_APP_ID }}"
          FIREBASE_MESSAGING_SENDER_ID: "${{ vars.FIREBASE_MESSAGING_SENDER_ID }}"
          FIREBASE_PROJECT_ID: "${{ vars.FIREBASE_PROJECT_ID }}"
          FIREBASE_AUTH_DOMAIN: "${{ vars.FIREBASE_AUTH_DOMAIN }}"
          FIREBASE_STORAGE_BUCKET: "${{ vars.FIREBASE_STORAGE_BUCKET }}"
          FIREBASE_WEB_PUSH_CERTIFICATE_KEY: "${{ vars.FIREBASE_WEB_PUSH_CERTIFICATE_KEY }}"
          ANDROID_KEYSTORE_PASSWORD: "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          ANDROID_KEY_ALIAS: "${{ secrets.ANDROID_KEY_ALIAS }}"
          ANDROID_KEY_PASSWORD: "${{ secrets.ANDROID_KEY_PASSWORD }}"
      - uses: actions/upload-artifact@v4
        with:
          name: siao-android
          path: frontend/app/build/app/outputs/flutter-apk/app-release.apk
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Última versão" --notes "APK mais recente do Sião."
          gh release upload latest frontend/app/build/app/outputs/flutter-apk/app-release.apk --clobber
      - name: Attach APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/app/build/app/outputs/flutter-apk/app-release.apk
