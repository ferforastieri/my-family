name: Android APK
on:
  push:
    branches: [main]
    paths:
      - "frontend/app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build release APK
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace/frontend/app \
            -e FIREBASE_API_KEY -e FIREBASE_APP_ID -e FIREBASE_MESSAGING_SENDER_ID \
            -e FIREBASE_PROJECT_ID -e FIREBASE_AUTH_DOMAIN -e FIREBASE_STORAGE_BUCKET \
            -e FIREBASE_WEB_PUSH_CERTIFICATE_KEY \
            ghcr.io/cirruslabs/flutter:stable sh -lc 'flutter pub get && flutter build apk --release --no-wasm-dry-run --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }} --dart-define=SOCKET_URL=${{ vars.SOCKET_URL }} --dart-define=LANDING_URL=${{ vars.PUBLIC_SITE_URL }} --dart-define=FIREBASE_API_KEY=$FIREBASE_API_KEY --dart-define=FIREBASE_APP_ID=$FIREBASE_APP_ID --dart-define=FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID --dart-define=FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID --dart-define=FIREBASE_AUTH_DOMAIN=$FIREBASE_AUTH_DOMAIN --dart-define=FIREBASE_STORAGE_BUCKET=$FIREBASE_STORAGE_BUCKET --dart-define=FIREBASE_WEB_PUSH_CERTIFICATE_KEY=$FIREBASE_WEB_PUSH_CERTIFICATE_KEY'
        env:
          FIREBASE_API_KEY: "${{ vars.FIREBASE_API_KEY }}"
          FIREBASE_APP_ID: "${{ vars.FIREBASE_APP_ID }}"
          FIREBASE_MESSAGING_SENDER_ID: "${{ vars.FIREBASE_MESSAGING_SENDER_ID }}"
          FIREBASE_PROJECT_ID: "${{ vars.FIREBASE_PROJECT_ID }}"
          FIREBASE_AUTH_DOMAIN: "${{ vars.FIREBASE_AUTH_DOMAIN }}"
          FIREBASE_STORAGE_BUCKET: "${{ vars.FIREBASE_STORAGE_BUCKET }}"
          FIREBASE_WEB_PUSH_CERTIFICATE_KEY: "${{ vars.FIREBASE_WEB_PUSH_CERTIFICATE_KEY }}"
      - uses: actions/upload-artifact@v4
        with:
          name: my-family-android
          path: frontend/app/build/app/outputs/flutter-apk/app-release.apk
      - name: Attach APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/app/build/app/outputs/flutter-apk/app-release.apk
