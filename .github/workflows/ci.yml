name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          {
            node-version: 22,
            cache: npm,
            cache-dependency-path: workers/api/package-lock.json,
          }
      - run: npm ci
        working-directory: workers/api
      - run: npm run typecheck
        working-directory: workers/api
      - run: npm audit --audit-level=high
        working-directory: workers/api
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260
        with: { sdk: stable }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - name: Analyze and build SEO landing
        working-directory: frontend/landing
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart pub global activate jaspr_cli 0.23.4
          export PATH="$HOME/.pub-cache/bin:$PATH"
          jaspr build --port 8099 \
            --sitemap-domain https://example.com \
            --sitemap-exclude '^/cadastro' \
            --dart-define SITE_URL=https://example.com \
            --dart-define API_URL=https://api.example.com/api \
            --dart-define APP_URL=https://app.example.com
          dart run tool/finalize.dart https://example.com https://api.example.com/api
      - name: Analyze and test Flutter projects
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace/frontend/app ghcr.io/cirruslabs/flutter:stable sh -lc 'flutter pub get && flutter analyze && flutter test && flutter build web --release --base-href /app/ --no-wasm-dry-run'
