name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Build and deploy on this server
    runs-on: my-family

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure remote Docker target
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          apt-get update
          apt-get install -y openssh-client
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          test -n "$DEPLOY_SSH_HOST" -a -n "$DEPLOY_SSH_USER" -a -n "$DEPLOY_SSH_PRIVATE_KEY" -a -n "$DEPLOY_SSH_KNOWN_HOSTS"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          printf 'DOCKER_HOST=ssh://%s@%s\n' "$DEPLOY_SSH_USER" "$DEPLOY_SSH_HOST" >> "$GITHUB_ENV"
          printf 'DOCKER_SSH_COMMAND=ssh -i %s -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=%s\n' "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts" >> "$GITHUB_ENV"
          docker -H "ssh://$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" version

      - name: Ensure Docker CLI
        run: |
          set -eu
          export DOCKER_CONFIG="$PWD/.docker"
          unset DOCKER_API_VERSION || true
          mkdir -p "$DOCKER_CONFIG"

          if ! command -v docker >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update
              apt-get install -y docker.io
            elif command -v apk >/dev/null 2>&1; then
              apk add --no-cache docker-cli
            else
              echo "Docker CLI is not installed in the runner image"
              exit 1
            fi
          fi

          if docker compose version >/dev/null 2>&1; then
            exit 0
          fi

          if command -v apt-get >/dev/null 2>&1; then
            apt-get update
            if apt-cache show docker-compose-plugin >/dev/null 2>&1; then
              apt-get install -y docker-compose-plugin
            fi
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache docker-cli-compose
          fi

          if ! docker compose version >/dev/null 2>&1; then
            COMPOSE_VERSION="v5.3.1"
            case "$(uname -m)" in
              x86_64|amd64) COMPOSE_ARCH="x86_64" ;;
              aarch64|arm64) COMPOSE_ARCH="aarch64" ;;
              *) echo "Unsupported architecture for Docker Compose: $(uname -m)"; exit 1 ;;
            esac

            if ! command -v curl >/dev/null 2>&1; then
              if command -v apt-get >/dev/null 2>&1; then
                apt-get install -y curl ca-certificates
              elif command -v apk >/dev/null 2>&1; then
                apk add --no-cache curl ca-certificates
              fi
            fi

            mkdir -p /usr/local/lib/docker/cli-plugins
            curl -fsSL \
              "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-${COMPOSE_ARCH}" \
              -o /usr/local/lib/docker/cli-plugins/docker-compose
            chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          fi

          docker compose version

      - name: Validate required secrets
        env:
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          THROTTLE_TTL_MS: ${{ secrets.THROTTLE_TTL_MS }}
          THROTTLE_LIMIT: ${{ secrets.THROTTLE_LIMIT }}
          CSRF_SECRET: ${{ secrets.CSRF_SECRET }}
          UPLOAD_HOST_PATH: ${{ secrets.UPLOAD_HOST_PATH }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SOCKET_URL: ${{ secrets.SOCKET_URL }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_ANDROID_API_KEY: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_WEB_PUSH_CERTIFICATE_KEY: ${{ secrets.FIREBASE_WEB_PUSH_CERTIFICATE_KEY }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -eu
          test -n "$MONGO_ROOT_PASSWORD" || { echo "Missing secret MONGO_ROOT_PASSWORD"; exit 1; }
          test -n "$JWT_SECRET" || { echo "Missing secret JWT_SECRET"; exit 1; }
          test -n "$LOG_LEVEL" || { echo "Missing secret LOG_LEVEL"; exit 1; }
          test -n "$THROTTLE_TTL_MS" || { echo "Missing secret THROTTLE_TTL_MS"; exit 1; }
          test -n "$THROTTLE_LIMIT" || { echo "Missing secret THROTTLE_LIMIT"; exit 1; }
          test -n "$CSRF_SECRET" || { echo "Missing secret CSRF_SECRET"; exit 1; }
          test -n "$UPLOAD_HOST_PATH" || { echo "Missing secret UPLOAD_HOST_PATH"; exit 1; }
          test -n "$API_BASE_URL" || { echo "Missing secret API_BASE_URL"; exit 1; }
          test -n "$SOCKET_URL" || { echo "Missing secret SOCKET_URL"; exit 1; }
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || { echo "Missing secret FIREBASE_SERVICE_ACCOUNT_JSON"; exit 1; }
          test -n "$FIREBASE_API_KEY" || { echo "Missing secret FIREBASE_API_KEY"; exit 1; }
          test -n "$FIREBASE_APP_ID" || { echo "Missing secret FIREBASE_APP_ID"; exit 1; }
          test -n "$FIREBASE_ANDROID_API_KEY" || { echo "Missing secret FIREBASE_ANDROID_API_KEY"; exit 1; }
          test -n "$FIREBASE_ANDROID_APP_ID" || { echo "Missing secret FIREBASE_ANDROID_APP_ID"; exit 1; }
          test -n "$FIREBASE_MESSAGING_SENDER_ID" || { echo "Missing secret FIREBASE_MESSAGING_SENDER_ID"; exit 1; }
          test -n "$FIREBASE_PROJECT_ID" || { echo "Missing secret FIREBASE_PROJECT_ID"; exit 1; }
          test -n "$FIREBASE_AUTH_DOMAIN" || { echo "Missing secret FIREBASE_AUTH_DOMAIN"; exit 1; }
          test -n "$FIREBASE_STORAGE_BUCKET" || { echo "Missing secret FIREBASE_STORAGE_BUCKET"; exit 1; }
          test -n "$GOOGLE_SERVICES_JSON" || { echo "Missing secret GOOGLE_SERVICES_JSON"; exit 1; }

      - name: Create deploy environment
        env:
          MONGO_ROOT_USER: ${{ secrets.MONGO_ROOT_USER }}
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
          MONGO_DB: ${{ secrets.MONGO_DB }}
          BACKEND_PORT: ${{ secrets.BACKEND_PORT }}
          FRONT_PORT: ${{ secrets.FRONT_PORT }}
          MONGO_PORT: ${{ secrets.MONGO_PORT }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          THROTTLE_TTL_MS: ${{ secrets.THROTTLE_TTL_MS }}
          THROTTLE_LIMIT: ${{ secrets.THROTTLE_LIMIT }}
          CSRF_SECRET: ${{ secrets.CSRF_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SOCKET_URL: ${{ secrets.SOCKET_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}
          PASSWORD_RESET_URL: ${{ secrets.PASSWORD_RESET_URL }}
          FIREBASE_SERVICE_ACCOUNT_PATH: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PATH }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_WEB_PUSH_CERTIFICATE_KEY: ${{ secrets.FIREBASE_WEB_PUSH_CERTIFICATE_KEY }}
          UPLOAD_HOST_PATH: ${{ secrets.UPLOAD_HOST_PATH }}
        run: |
          set -eu
          umask 077
          {
            printf 'MONGO_ROOT_USER=%s\n' "${MONGO_ROOT_USER:-my_family}"
            printf 'MONGO_ROOT_PASSWORD=%s\n' "$MONGO_ROOT_PASSWORD"
            printf 'MONGO_DB=%s\n' "${MONGO_DB:-my-family}"
            printf 'BACKEND_PORT=%s\n' "${BACKEND_PORT:-3459}"
            printf 'FRONT_PORT=%s\n' "${FRONT_PORT:-3458}"
            printf 'MONGO_PORT=%s\n' "${MONGO_PORT:-27019}"
            printf 'REDIS_PORT=%s\n' "${REDIS_PORT:-6389}"
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'LOG_LEVEL=%s\n' "$LOG_LEVEL"
            printf 'THROTTLE_TTL_MS=%s\n' "$THROTTLE_TTL_MS"
            printf 'THROTTLE_LIMIT=%s\n' "$THROTTLE_LIMIT"
            printf 'CSRF_SECRET=%s\n' "$CSRF_SECRET"
            printf 'JWT_EXPIRES_IN=%s\n' "${JWT_EXPIRES_IN:-7d}"
            printf 'CORS_ORIGIN=%s\n' "${CORS_ORIGIN:-*}"
            printf 'API_BASE_URL=%s\n' "$API_BASE_URL"
            printf 'SOCKET_URL=%s\n' "$SOCKET_URL"
            printf 'SMTP_HOST=%s\n' "${SMTP_HOST:-}"
            printf 'SMTP_PORT=%s\n' "${SMTP_PORT:-587}"
            printf 'SMTP_USER=%s\n' "${SMTP_USER:-}"
            printf 'SMTP_PASS=%s\n' "${SMTP_PASS:-}"
            printf 'EMAIL_FROM=%s\n' "${EMAIL_FROM:-}"
            printf 'EMAIL_FROM_NAME="%s"\n' "${EMAIL_FROM_NAME:-Nossa Familia}"
            printf 'PASSWORD_RESET_URL=%s\n' "${PASSWORD_RESET_URL:-}"
            printf 'FIREBASE_SERVICE_ACCOUNT_PATH=%s\n' "${FIREBASE_SERVICE_ACCOUNT_PATH:-}"
            printf 'FIREBASE_SERVICE_ACCOUNT_JSON=%s\n' "${FIREBASE_SERVICE_ACCOUNT_JSON:-}"
            printf 'FIREBASE_API_KEY=%s\n' "${FIREBASE_API_KEY:-}"
            printf 'FIREBASE_APP_ID=%s\n' "${FIREBASE_APP_ID:-}"
            printf 'FIREBASE_MESSAGING_SENDER_ID=%s\n' "${FIREBASE_MESSAGING_SENDER_ID:-}"
            printf 'FIREBASE_PROJECT_ID=%s\n' "${FIREBASE_PROJECT_ID:-}"
            printf 'FIREBASE_AUTH_DOMAIN=%s\n' "${FIREBASE_AUTH_DOMAIN:-}"
            printf 'FIREBASE_STORAGE_BUCKET=%s\n' "${FIREBASE_STORAGE_BUCKET:-}"
            printf 'FIREBASE_WEB_PUSH_CERTIFICATE_KEY=%s\n' "${FIREBASE_WEB_PUSH_CERTIFICATE_KEY:-}"
            printf 'UPLOAD_HOST_PATH=%s\n' "$UPLOAD_HOST_PATH"
          } > .env

      - name: Deploy containers
        run: |
          set -eu
          export DOCKER_CONFIG="$PWD/.docker"
          unset DOCKER_API_VERSION || true
          mkdir -p "$DOCKER_CONFIG"

          if docker compose version >/dev/null 2>&1; then
            COMPOSE="docker compose"
          elif command -v docker-compose >/dev/null 2>&1; then
            COMPOSE="docker-compose"
          else
            echo "Docker Compose is not configured in the runner/server"
            exit 1
          fi

          export COMPOSE_PROJECT_NAME=my-family
          docker rm -f my-family-front my-family-backend my-family-redis my-family-mongo >/dev/null 2>&1 || true
          $COMPOSE --env-file .env down --remove-orphans || true
          $COMPOSE --env-file .env -f docker-compose.yml config >/dev/null
          $COMPOSE --env-file .env build --pull
          $COMPOSE --env-file .env up -d mongo redis
          $COMPOSE --env-file .env up -d --remove-orphans
          $COMPOSE --env-file .env ps

      - name: Build Android APK
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SOCKET_URL: ${{ secrets.SOCKET_URL }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_WEB_PUSH_CERTIFICATE_KEY: ${{ secrets.FIREBASE_WEB_PUSH_CERTIFICATE_KEY }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          # Android builds stay on the runner CT, which has more headroom than the app target.
          unset DOCKER_HOST DOCKER_SSH_COMMAND DOCKER_API_VERSION || true
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing secret ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing secret ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing secret ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing secret ANDROID_KEY_PASSWORD"; exit 1; }

          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/android/app/google-services.json
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/android/app/release-keystore.jks

          flutter_container="my-family-flutter-${GITHUB_RUN_ID:-manual}"
          docker volume create my-family-flutter-pub-cache >/dev/null
          docker volume create my-family-flutter-gradle-cache >/dev/null
          docker rm -f "$flutter_container" >/dev/null 2>&1 || true
          docker create \
            --name "$flutter_container" \
            --workdir /app \
            --memory=5g \
            --cpus=4 \
            --volume my-family-flutter-pub-cache:/root/.pub-cache \
            --volume my-family-flutter-gradle-cache:/root/.gradle \
            ghcr.io/cirruslabs/flutter:stable \
            tail -f /dev/null >/dev/null
          trap 'docker rm -f "$flutter_container" >/dev/null 2>&1 || true' EXIT
          docker start "$flutter_container" >/dev/null
          tar \
            --exclude=.git \
            --exclude=build \
            --exclude=.dart_tool \
            -C app -cf - . | docker exec -i "$flutter_container" tar -xf - -C /app

          docker exec \
            -e ANDROID_KEYSTORE_PATH=/app/android/app/release-keystore.jks \
            -e ANDROID_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
            -e ANDROID_KEY_ALIAS="$ANDROID_KEY_ALIAS" \
            -e ANDROID_KEY_PASSWORD="$ANDROID_KEY_PASSWORD" \
            "$flutter_container" \
            flutter pub get

          docker exec \
            -e ANDROID_KEYSTORE_PATH=/app/android/app/release-keystore.jks \
            -e ANDROID_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
            -e ANDROID_KEY_ALIAS="$ANDROID_KEY_ALIAS" \
            -e ANDROID_KEY_PASSWORD="$ANDROID_KEY_PASSWORD" \
            "$flutter_container" \
            flutter build apk --release \
              --no-pub \
              --dart-define=API_BASE_URL="$API_BASE_URL" \
              --dart-define=SOCKET_URL="$SOCKET_URL" \
              --dart-define=FIREBASE_API_KEY="${FIREBASE_API_KEY:-}" \
              --dart-define=FIREBASE_APP_ID="${FIREBASE_APP_ID:-}" \
              --dart-define=FIREBASE_MESSAGING_SENDER_ID="${FIREBASE_MESSAGING_SENDER_ID:-}" \
              --dart-define=FIREBASE_PROJECT_ID="${FIREBASE_PROJECT_ID:-}" \
              --dart-define=FIREBASE_AUTH_DOMAIN="${FIREBASE_AUTH_DOMAIN:-}" \
              --dart-define=FIREBASE_STORAGE_BUCKET="${FIREBASE_STORAGE_BUCKET:-}" \
              --dart-define=FIREBASE_WEB_PUSH_CERTIFICATE_KEY="${FIREBASE_WEB_PUSH_CERTIFICATE_KEY:-}"

          mkdir -p app/build/app/outputs/flutter-apk
          docker cp \
            "$flutter_container:/app/build/app/outputs/flutter-apk/app-release.apk" \
            app/build/app/outputs/flutter-apk/app-release.apk
          docker rm -f "$flutter_container" >/dev/null
          trap - EXIT

      - name: Upload Android APK
        uses: actions/upload-artifact@v3
        with:
          name: my-family-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
