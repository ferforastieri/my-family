services:
  mongo:
    image: mongo:7
    container_name: my-family-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-my_family}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-my-family}
    volumes:
      - mongo_data:/data/db
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    networks:
      - my-family-network

  redis:
    image: redis:7-alpine
    container_name: my-family-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:?REDIS_PASSWORD is required}",
      ]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks:
      - my-family-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${BACKEND_IMAGE:-my-family-backend:local}
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: my-family-api
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-my_family}:${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}@mongo:27017/${MONGO_DB:-my-family}?authSource=admin
      MONGO_DB: ${MONGO_DB:-my-family}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      PORT: 3001
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:?LOG_LEVEL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      UPLOAD_PATH: /data/uploads
      INVITATION_URL: ${INVITATION_URL:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:?TURNSTILE_SECRET is required}
      PHONE_OTP_SECRET: ${PHONE_OTP_SECRET:?PHONE_OTP_SECRET is required}
      DEFAULT_PHONE_COUNTRY_CODE: ${DEFAULT_PHONE_COUNTRY_CODE:-55}
      PLATFORM_ADMIN_PHONE: ${PLATFORM_ADMIN_PHONE:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v23.0}
      WHATSAPP_OTP_TEMPLATE: ${WHATSAPP_OTP_TEMPLATE:-}
      WHATSAPP_INVITATION_TEMPLATE: ${WHATSAPP_INVITATION_TEMPLATE:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      THROTTLE_TTL_MS: ${THROTTLE_TTL_MS:?THROTTLE_TTL_MS is required}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:?THROTTLE_LIMIT is required}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:?TRUST_PROXY_HOPS is required}
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:?COOKIE_DOMAIN is required}
      PROCESS_ROLE: api
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_MEDIA_BUCKET: ${R2_MEDIA_BUCKET:-}
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:-}
      MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET:-}
    ports:
      - "${BACKEND_PORT:-3459}:3001"
    volumes:
      - ${UPLOAD_HOST_PATH:?UPLOAD_HOST_PATH is required}:/data/uploads
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - my-family-network

  worker:
    image: ${BACKEND_IMAGE:-my-family-backend:local}
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: my-family-worker
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-my_family}:${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}@mongo:27017/${MONGO_DB:-my-family}?authSource=admin
      MONGO_DB: ${MONGO_DB:-my-family}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      NODE_ENV: production
      PROCESS_ROLE: worker
      LOG_LEVEL: ${LOG_LEVEL:?LOG_LEVEL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      UPLOAD_PATH: /data/uploads
      THROTTLE_TTL_MS: ${THROTTLE_TTL_MS:?THROTTLE_TTL_MS is required}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:?THROTTLE_LIMIT is required}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:?TRUST_PROXY_HOPS is required}
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:?COOKIE_DOMAIN is required}
      PHONE_OTP_SECRET: ${PHONE_OTP_SECRET:?PHONE_OTP_SECRET is required}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:?TURNSTILE_SECRET is required}
      DEFAULT_PHONE_COUNTRY_CODE: ${DEFAULT_PHONE_COUNTRY_CODE:-55}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_MEDIA_BUCKET: ${R2_MEDIA_BUCKET:-}
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:-}
      MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET:-}
    volumes:
      - ${UPLOAD_HOST_PATH:?UPLOAD_HOST_PATH is required}:/data/uploads
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - my-family-network

networks:
  my-family-network:
    driver: bridge

volumes:
  mongo_data:
